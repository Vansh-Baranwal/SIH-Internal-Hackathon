services:
  - type: web
    name: lunar-hazard-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.lunar_hazard_mapper.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: FRONTEND_ORIGIN
        sync: false
