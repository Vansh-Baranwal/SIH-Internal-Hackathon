[project]
name = "lunar-hazard-mapper"
version = "0.1.0"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "rasterio",
    "pyproj",
    "shapely",
    "opencv-python",
    "scikit-image",
    "pytest",
    "jsonschema",
    "matplotlib",
    "PyYAML"
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
lhm-data-pipeline = "lunar_hazard_mapper.m1_data.pipeline:main"
